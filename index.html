<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="코드를 더한 체육수업 SHOW ROOM — 봉산중학교 김현태 · 성덕중학교 정승현 · 이희권">
<meta property="og:title" content="코드를 더한 체육수업 SHOW ROOM">
<meta property="og:description" content="쇼룸 준비중...">
<style>html,body{margin:0}</style>
<title>코드를 더한 체육수업 SHOW ROOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: a single centered type block on beige. Single committed light look. */
:root {
  --bg: #EFE8DC;
  --fg: #2B2620;
  --muted: #8A7F70;
  --rule: #C9BEAD;
  --serif-en: "Cormorant Garamond", "Times New Roman", serif;
  --serif-ko: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--serif-ko); }
.wrap {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 28px;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.kicker { font-size: 15px; letter-spacing: .12em; color: var(--muted); margin: 0; }
h1 {
  margin: 0; font-family: var(--serif-en); font-weight: 500;
  font-size: clamp(48px, 14vw, 88px); line-height: 1; letter-spacing: .14em;
  padding-left: .14em; /* balance tracking */
}
.rule { width: 48px; height: 1px; background: var(--rule); }
.soon { margin: 0; font-size: 18px; letter-spacing: .2em; }
.soon i { font-family: var(--serif-en); font-style: italic; color: var(--muted); letter-spacing: .05em; display: block; font-size: 17px; margin-top: 6px; }
.names { margin: 0; font-size: 14px; line-height: 2; color: var(--muted); letter-spacing: .06em; }
.names b { color: var(--fg); font-weight: 400; }
</style>

</head>
<body>
<main class="wrap">
  <p class="kicker">코드를 더한 체육수업</p>
  <h1>SHOW ROOM</h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="soon">쇼룸 준비중...<i>coming soon</i></p>
  <p class="names">봉산중학교 <b>김현태</b><br>성덕중학교 <b>정승현 · 이희권</b></p>
</main>
</body>
</html>
