/* 홈 순위 카드(2026-10-11 사용자 요청): 1~5위 → 6~10위 → 11~15위가 한쪽으로만 계속 넘어간다(CSS leadSlide2/3).
   첫 장 = 1위 큰 카드 + 2~5위 줄, 둘째 장 = 6~10위, 셋째 장 = 11~15위. 맨 끝에 첫 장을 한 번 더 붙여 두고,
   거기까지 넘어간 뒤 처음 위치로 몰래 되돌려서 거꾸로 돌아오는 움직임 없이 이어진다. 6위부터 없으면 넘어가지 않는다. 마우스를 올리면 멈춘다.
   hero·row는 그림을 만드는 함수다(첫 장을 두 번 그릴 때 그림 속 이름표가 겹치지 않게 새로 만든다) */
function leadBody(hero,row,n){
  const ol=(a,b)=>`<ol class="lead-list">${Array.from({length:Math.max(0,Math.min(b,n)-a)},(_,k)=>row(a+k)).join('')}</ol>`;
  const first=()=>`${hero()}${ol(1,5)}`,pages=[`<div class="lead-pg">${first()}</div>`];
  if(n>5)pages.push(`<div class="lead-pg pg2">${ol(5,10)}</div>`);
  if(n>10)pages.push(`<div class="lead-pg pg2">${ol(10,15)}</div>`);
  const P=pages.length;if(P>1)pages.push(`<div class="lead-pg" aria-hidden="true">${first()}</div>`);
  return `<div class="lead-win"><div class="lead-track${P>1?' slide s'+P:''}" style="--np:${pages.length}">${pages.join('')}</div></div>`;
}
function leaderCard(title,list,fmt,more){
  const cn=id=>esc(findCls(id)?.name||'');
  if(!list.length)return `<article class="panel lead"><h3 class="lead-t">${title}</h3><div class="empty" style="flex:1">아직 기록이 없어요.</div></article>`;
  const f=list[0];
  return `<article class="panel lead"><h3 class="lead-t">${title}</h3>
    ${leadBody(()=>`<div class="lead-1" data-player="${esc(f.pid)}" tabindex="0" role="button"><span class="medal">1</span><div class="lead-j">${jBare(pObj(f.pid,f.name))}</div>
      <div class="lead-n">${esc(f.name)}</div><div class="lead-c">${cn(f.classId)}</div><div class="lead-v">${fmt(f.v)}</div></div>`,
    i=>{const r=list[i];return `<li class="click" data-player="${esc(r.pid)}" tabindex="0"><span class="rk">${i+1}</span><span class="sj">${jBare(pObj(r.pid,r.name))}</span><span class="nm"><b>${esc(r.name)}</b><small>${cn(r.classId)}</small></span><span class="v">${fmt(r.v)}</span></li>`},list.length)}
    ${more||''}</article>`;
}
function classCard(){

// 남학생 → 여학생 → 혼성 순서로 리그 순위를 구분별로 그린다(경기가 있는 구분만). 하나도 없으면 빈 순위 칸 하나.
// slide(홈, 2026-10-15 사용자 요청 "순위 카드처럼 넘어가게"): 한 칸 안에서 구분별 표가 한쪽으로만 계속 넘어간다(leadBody와 같은 방식, 끝에 첫 표 복사본).
// 기록실은 자세히 보는 곳이라 위아래로 모두 펼친다
function standingsPanels(slide){
  const sub='<span class="sub">진행 중인 경기 포함 · 실시간</span>',parts=KINDS.map(([k,n])=>[k,n,standings(k)]).filter(x=>x[2].length);
  if(!parts.length)return `<section class="panel"><div class="ph"><span>리그 순위</span>${sub}</div>${standingsTable([])}</section>`;
  const one=([k,n,st])=>`<div class="ph"><span><span class="st-kind k-${k==='여'?'f':k==='남'?'m':'x'}">${n}</span> 리그 순위</span>${sub}</div>${standingsTable(st)}`;
  if(!slide||parts.length<2)return parts.map(p=>`<section class="panel st-panel">${one(p)}</section>`).join('');
  const pages=[...parts.map(p=>`<div class="lead-pg">${one(p)}</div>`),`<div class="lead-pg" aria-hidden="true">${one(parts[0])}</div>`];
  return `<section class="panel st-panel st-slide"><div class="lead-win"><div class="lead-track slide s${parts.length}" style="--np:${pages.length}">${pages.join('')}</div></div></section>`;
}
function standingsTable(st){
  if(!st.length)return `<div class="empty"><strong>아직 경기가 없어요</strong>PLAY BALL에서 첫 경기를 시작해 보세요.${state.readOnly?'':'<br><button class="btn go" data-go="play">경기 만들기</button>'}</div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>순위</th><th>팀</th><th class="num">승률</th><th class="num">경기</th><th class="num">승</th><th class="num">패</th><th class="num">무</th><th class="num">득실</th><th>최근 5경기</th></tr></thead><tbody>
    ${st.map((r,i)=>`<tr><td class="L" style="font-size:17px">${i+1}</td><td class="strong"><span class="tname">${teamLogo(r)}${esc(r.name)}${r.live?'<span class="st-live"><i></i>경기 중</span>':''}</span></td><td class="num L wpct">${rate(r.W,r.W+r.L)}</td><td class="num">${r.G}</td><td class="num">${r.W}</td><td class="num">${r.L}</td><td class="num">${r.D}</td><td class="num">${r.RS-r.RA>0?'+':''}${r.RS-r.RA}</td><td><span class="form">${r.recent.slice(-5).map((x,j,a)=>`<i class="f${x.res} ${j===a.length-1?'last':''}${x.on?' on':''}"${x.on?' title="진행 중인 경기(지금 점수 기준)"':''}>${x.res==='W'?'승':x.res==='L'?'패':'무'}</i>`).join('')}</span></td></tr>`).join('')}</tbody></table></div>`;
}
/* 홈 "진행 중인 경기" 칸(2026-10-06 "검정이 심심하다, 간지나게"): TV 스포츠 중계 점수판처럼.
   왼쪽 빨간 생방송 띠, 위 줄에 ● LIVE·경기 구분·이닝(▲초 ▼말), 아래 줄에 반 로고 + 큰 점수 상자(앞선 팀 점수는 금색) + 주자 다이아몬드·아웃 + 문자중계 보기.
   바탕은 남색에 왼쪽 위 빨간 빛, 오른쪽 아래 초록(잔디) 빛, 은은한 사선 줄무늬. 움직이는 빛은 없다 */
function liveCard(g){
  const s=sim(g),[a,h]=g.teams,lead=s.score[0]===s.score[1]?-1:s.score[0]>s.score[1]?0:1;
  const team=(t,rev)=>{const l=teamLogo({classId:t.classId,name:t.name,color:t.color});return `<span class="lc-team">${rev?`<b>${esc(t.name)}</b>${l}`:`${l}<b>${esc(t.name)}</b>`}</span>`};
  const sc=i=>`<b class="${lead===i?'lead':''}">${s.score[i]}</b>`;
  const bases=[[22,7,2],[10,18,3],[34,18,1]].map(([x,y,i])=>`<rect x="${x-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${s.bases[i]?'#FFD23F':'rgba(255,255,255,.2)'}" stroke="${s.bases[i]?'#FFF3B0':'rgba(255,255,255,.35)'}" stroke-width=".8"/>`).join('');
  return `<section class="live-card"><div class="lc-head"><span class="lc-onair"><i></i>LIVE</span><span>진행 중인 경기</span>${g.gtype?`<span class="lc-meta">${esc(g.gtype)}</span>`:''}<span class="lc-inn">${s.inning}회${s.top?'초':'말'}<span class="arr">${s.top?'▲':'▼'}</span></span></div>
    <div class="lc-body">${team(a)}<span class="lc-score">${sc(0)}<i>:</i>${sc(1)}</span>${team(h,true)}
      <span class="lc-situ" title="주자와 아웃"><svg viewBox="0 0 44 26" width="56" height="33" aria-label="주자">${bases}</svg><span class="lc-outs"><small>OUT</small>${[0,1].map(k=>`<i class="${k<s.outs?'on':''}"></i>`).join('')}</span></span>
      <span style="flex:1"></span><button class="live-btn" data-live="${esc(g.id)}"><span class="lv-tag"><i></i>LIVE</span>문자중계 보기<span class="lv-arr" aria-hidden="true">›</span></button></div></section>`;
}
function pgHome(){
  const live=state.data.games.filter(g=>g.status!=='final');
  // 선수관리에서 지운 선수는 순위에 내지 않는다(2026-10-06 요청). 지난 경기 기록 자체는 점수가 맞도록 그대로 둔다.
  const fin=finals().slice(0,5),se=season(),bats=Object.values(se.bat).filter(r=>findPlayer(r.pid)),pits=Object.values(se.pit).filter(r=>findPlayer(r.pid));
  const top=(arr,key,filt)=>arr.filter(filt).sort((a,b)=>b[key]-a[key]).slice(0,15).map(r=>({pid:r.pid,name:r.name,classId:r.classId,v:r[key]}));
  const r3=v=>v.toFixed(3).replace(/^0/,''),n=u=>v=>`${v}${u}`;
  const more=(sort,tab='bat')=>`<button class="lead-more" data-go="records" data-rtab="${tab}" data-sort="${sort}">더보기</button>`;
  const ab=[];for(const c of classes())for(const p of c.players||[]){const o=overall(p);if(o)ab.push({pid:p.id,name:p.name,classId:c.id,v:o.avg})}
  ab.sort((a,b)=>b.v-a.v);
  const news=allNews().slice(0,8);
  const lead=b=>(String(b||'').split(/\n+/).find(x=>x.trim())||'').trim(); // 기사 첫 문단
  return `<div class="page-head"><div><h2>홈</h2><p>부문별 순위와 리그 소식을 한눈에 봐요.</p></div></div>
  ${live.map(liveCard).join('')}
  <div class="leads">
    ${/* 배치(2026-10-11 사용자 요청): 윗줄 종합 능력치·타율·홈런·안타·수비왕, 아랫줄 학급 능력치·타점·OPS·탈삼진 */''}
    ${leaderCard('종합 능력치 <small class="lead-sub">(팝스, 수행평가 기반)</small>',ab.slice(0,15),v=>`<span class="${gcls(LETTER[Math.round(v)])}">${LETTER[Math.round(v)]}</span> <small>${v.toFixed(2)}</small>`,'<button class="lead-more" data-go="players">더보기</button>')}
    ${leaderCard('타율',top(bats,'AVG',b=>b.PA>=2&&b.AB>0),r3,more('AVG'))}
    ${leaderCard('홈런',top(bats,'HR',b=>b.HR>0),n('개'),more('HR'))}
    ${leaderCard('안타',top(bats,'H',b=>b.H>0),n('개'),more('H'))}
    ${leaderCard('수비왕 <small class="lead-sub">(수비 성공 횟수)</small>',top(bats,'DF',b=>b.DF>0),n('회'),more('DF'))}

}

function teamNameIsAuto(teams,i){const c=findCls(teams[i].classId);if(!c)return false;const n=String(teams[i].name||'').trim();
  return ['',' 남',' 여'].some(s=>['',' 청팀',' 백팀'].some(t=>n===c.name+s+t))}
function refreshTeamNames(teams,gt,force){teams.forEach((tm,i)=>{if(i===force||teamNameIsAuto(teams,i))tm.name=teamAutoName(teams,i,gt)})}
function usedPids(){return new Set(state.setup.teams.flatMap(t=>t.lineup.map(e=>e.pid)))}

function animateMoves(g,before,ev){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const svg=document.querySelector('svg.field');if(!svg)return;

  const scored=new Set(s.log.slice(before.logLen).filter(e=>e.k==='run'&&e.pid).map(e=>e.pid)); // 이번 기록으로 홈인한 선수
  const dest=pid=>{const k=s.bases.indexOf(pid);return k>0?k:scored.has(pid)?4:0};
  if(before.batter){const d=dest(before.batter.pid);if(d)movers.push({pid:before.batter.pid,from:0,to:d})}
  for(const i of [3,2,1]){const p=before.bases[i];if(!p)continue;const d=dest(p);if(d>i)movers.push({pid:p,from:i,to:d})}

    const pts=[];for(let b=m.from;b<=m.to;b++)pts.push(runPt(b));

    const kf=pts.map((p,i)=>({...tf(p,i===0||i===pts.length-1?1:1.18),offset:i/(pts.length-1)}));
    const dur=RUN_MS*(pts.length-1);runMs=Math.max(runMs,dur);
    const a=el.animate(kf,{duration:dur,easing:'linear',fill:'forwards'});
    a.onfinish=()=>{el.remove();if(still)still.style.opacity=''};
  }
  if(!label)return runMs;
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x','300');t.setAttribute('y','230');t.setAttribute('text-anchor','middle');t.setAttribute('class','run-pop'+(r==='HR'?' hr':''));t.textContent=label;

  const dfCell=pid=>{const v=s.df[pid]||0;return fx?`<span class="dfx"><button type="button" class="dfb" data-act="df-adj" data-pid="${esc(pid)}" data-d="-1" aria-label="수비 성공 1 빼기" ${v?'':'disabled'}>−</button>${hitTag(v,'hdf')}<button type="button" class="dfb" data-act="df-adj" data-pid="${esc(pid)}" data-d="1" aria-label="수비 성공 1 더하기">+</button></span>`:hitTag(v,'hdf')};
  // 시즌 타율: season()에 끝난 경기와 진행 중인 경기(지금 경기 포함)가 모두 들어 있다(2026-10-08부터)
  const se=season().bat;
  const seasonHA=pid=>{const a=se[pid]||{};return {H:a.H||0,AB:a.AB||0}};
  const pc=(p,pre)=>`<span class="pcell"><span class="bx-j">${jersey(p,overall(p)?.letter,false)}</span><b>${pre||''}${esc(p.name)}</b></span>`;
  // 타순 자리마다 처음 선수 → 교체로 들어온 선수 순서로 보여 준다. 교체돼 나간 선수는 흐리게.
  // 라인업에서 뺀 선수(선수 제거)는 기록이 보이도록 맨 아래에 흐리게 "제외"로 둔다(no=0)
  const slots=[...s.chain[ti].map((ch,j)=>[ch,j+1]),...(s.gone?.[ti]||[]).map(ch=>[ch,0])];
  const rows=slots.map(([ch,no])=>ch.map((pid,k)=>{const b=s.bat[pid]||{},last=k===ch.length-1,on=!!no&&last,now=on&&!s.over&&s.bt===ti&&s.batter?.pid===pid,p=gObj(g,s,pid);
    return `<tr class="${now?'sel':''}${on?'':' gone'}"><td>${k?'':no||'-'}</td><td>${pc(p,k?'↳ ':'')}</td><td>${on?esc(s.pos[ti][pid]||'-'):!no&&last?'제외':'교체'}</td><td class="num">${(z=>avgTag(z.H,z.AB))(seasonHA(pid))}</td><td class="num">${b.AB||0}</td><td class="num">${hitTag(b.H||0,'hh')}</td><td class="num">${hitTag(b.HR||0,'hhr')}</td><td class="num">${b.RBI||0}</td><td class="num">${b.R||0}</td><td class="num">${dfCell(pid)}</td><td class="num">${b.BB||0}</td><td class="num">${b.K||0}</td><td class="num">${s.fe[pid]||0}</td></tr>`}).join('')).join('');
  const pits=Object.keys(s.pit).filter(pid=>s.M[pid]?.team===ti).map(pid=>{const p=s.pit[pid],o=gObj(g,s,pid);return `<tr><td>${pc(o)}</td><td class="num">${ip(p.O)}</td><td class="num">${p.NP}</td><td class="num">${p.H}</td><td class="num">${p.R}</td><td class="num">${p.BB}</td><td class="num">${p.K}</td></tr>`}).join('');
  return `<div class="ph"><span>${esc(t.name)} 타자</span></div><div class="tbl-wrap"><table class="tbl bx"><thead><tr><th>타순</th><th>선수</th><th>위치</th><th class="num avg-h">시즌 타율</th><th class="num">타수</th><th class="num h-h">안타</th><th class="num h-hr">홈런</th><th class="num">타점</th><th class="num">득점</th><th class="num h-df">수비</th><th class="num">볼넷</th><th class="num">삼진</th><th class="num">실책</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${pits?`<div class="tbl-wrap"><table class="tbl bx"><thead><tr><th>투수</th><th class="num">이닝</th><th class="num">투구수</th><th class="num">피안타</th><th class="num">실점</th><th class="num">볼넷</th><th class="num">삼진</th></tr></thead><tbody>${pits}</tbody></table></div>`:''}`;
}
function pgLive(){
  const g=curGame();if(!g){state.page='play';return pgPlay()}
  const s=sim(g),can=!state.readOnly,has=[1,2,3].some(i=>s.bases[i]);
  const fx=can&&s.over&&state.fix===g.id; // 끝난 경기 기록 고치기 중(2026-10-26, 10-27부터 끝난 경기에서만)
  const ctrl=can?(s.over?`<div class="ctrl"><div class="keys"><button class="key undo" data-act="undo" ${g.events.length?'':'disabled'}>↶ 되돌리기</button><button class="key subst" data-act="fix-mode" aria-pressed="${fx}">${fx?'✔ 다 고쳤어요':'✏️ 기록 고치기'}</button><button class="key" data-go="records" data-rtab="games">기록실</button><button class="key out" data-act="del-game">경기 삭제</button></div></div>`
    :`<div class="ctrl">
      <h5>투구</h5><div class="keys three"><button class="key ball" data-act="pitch" data-r="B">볼</button><button class="key strike" data-act="pitch" data-r="S">스트라이크</button><button class="key" data-act="pitch" data-r="F">파울</button></div>
      <h5>타격 결과</h5><div class="keys">
        <button class="key hit" data-act="pa" data-r="1B">1루타</button><button class="key hit" data-act="pa" data-r="2B">2루타</button><button class="key hit" data-act="pa" data-r="3B">3루타</button><button class="key hr" data-act="pa" data-r="HR">홈런</button>
        <button class="key walk" data-act="pa" data-r="BB">볼넷</button><button class="key walk" data-act="pa" data-r="HBP">몸에 맞는 볼</button><button class="key walk" data-act="pa" data-r="E">실책 출루</button><button class="key walk" data-act="pa" data-r="FC" ${has?'':'disabled'}>야수선택</button>
        <button class="key out" data-act="pa" data-r="K">삼진</button><button class="key out" data-act="pa" data-r="GO">땅볼 아웃</button><button class="key out" data-act="pa" data-r="FO">뜬공 아웃</button><button class="key skip" data-act="skip-bat" title="결석한 학생 차례를 아웃 없이 건너뛰어요">⏭ 넘어가기 <small>(아웃 아님)</small></button></div>
      <h5>경기 운영</h5><div class="keys five"><button class="key undo" data-act="undo" ${g.events.length?'':'disabled'}>↶ 되돌리기</button><button class="key subst" data-act="open-lineup">📝 라인업 수정</button><button class="key" data-act="change-pitcher">투수 교체</button><button class="key" data-act="half">공수교대</button><button class="key" data-act="end-game">경기 종료</button></div>
      <p class="hint" style="margin:0">경기장의 주자를 누르면 진루, 견제사, 주루사를 기록할 수 있어요.</p>
    </div>`):'';
  const groups=[];for(const e of s.log){if(e.k==='half'||!groups.length)groups.push({h:e.k==='half'?e.t:'',items:[]});if(e.k!=='half')groups[groups.length-1].items.push(e)}
  const chunks=items=>{const c=[];for(const e of items){if(e.k==='bat'||!c.length||e.k==='end')c.push([e]);else c[c.length-1].push(e)}return c.reverse().flat()};
  const li=e=>{if(e.k==='bat'&&e.pid){const p=gObj(g,s,e.pid);return `<div class="li bat"><div>${esc(e.t)}</div><span class="lj">${jersey(p,overall(p)?.letter,false)}</span></div>`}return `<div class="li ${e.k}">${esc(e.t)}</div>`};
  const logHtml=groups.slice().reverse().map(gr=>`<div class="lg"><div class="lg-h">${esc(gr.h)}</div>${chunks(gr.items).map(li).join('')||'<div class="li pitch">아직 기록이 없어요.</div>'}</div>`).join('');
  // 기록 고치기 줄(2026-10-26 사용자 요청: 경기가 끝난 뒤 선생님이 기억한 수비 성공 횟수를 넣고 싶다).
  // 10-27 사용자 요청으로 끝난 경기에서만 보이고, 고치는 것은 [라인업, 기록]의 수비 칸 [−][+]뿐이다(타석 [✏️ 고치기]·학생 [바꾸기]는 뺐다)
  const fixbar=!can||!s.over?'':fx?`<div class="fixbar on"><span><b>✏️ 기록 고치는 중</b>${state.liveTab==='box'?'수비 칸의 [−][+]로 학생마다 수비 성공 횟수를 맞춰 주세요.':'[라인업, 기록]을 누르면 수비 칸의 [−][+]로 수비 성공을 고칠 수 있어요.'}</span><button type="button" class="btn go" data-act="fix-mode">✔ 다 고쳤어요</button></div>`
    :`<div class="fixbar"><button type="button" class="btn fixbtn" data-act="fix-mode">✏️ 기록 고치기</button><span>끝난 경기의 수비 성공 횟수를 고칠 수 있어요.</span></div>`;
  const right=`<section class="panel">${fixbar}<div class="ltabs" role="tablist"><button class="ltab" role="tab" data-ltab="log" aria-selected="${state.liveTab==='log'}">문자중계</button><button class="ltab" role="tab" data-ltab="box" aria-selected="${state.liveTab==='box'}">라인업, 기록</button></div>
    ${state.liveTab==='log'?`<div class="log">${logHtml}</div>`:`${boxTable(g,s,0)}${boxTable(g,s,1)}`}</section>`;
  const sc=g.scorers?.length?` 기록원 ${g.scorers.map(x=>esc(x.name)).join(', ')}`:'';
  // 경기장 오른쪽 아래(빈 파울 지역 위에 겹쳐서 공간을 차지하지 않음)에는 [수비 위치 바꾸기]만 둔다.
  // 방송 버튼 세 개는 왼쪽 메뉴 아래로 옮겼다(sideAnn, 2026-10-06 사용자 요청: 볼·스트라이크 버튼이 한 화면에 들어오게).
  const posBtn=can&&!s.over?`<div class="ann ann-r"><button class="btn" data-act="open-pos">수비 위치 바꾸기</button></div>`:'';
  return `<div class="page-head"><div><h2>${esc(g.teams[0].name)} vs ${esc(g.teams[1].name)}</h2><p>${g.gtype?esc(g.gtype)+'. ':''}${s.over?'종료된 경기예요.':'기록할 때마다 모든 화면에 바로 반영돼요.'}${sc}</p></div><button class="btn sm" data-go="play">← PLAY BALL</button></div>
   ${scoreboard(g,s)}
   <div class="live-grid"><section class="panel fieldp"><div class="fieldrow"><div class="fside">${fieldBox(g,s)}</div>${fieldSVG(g,s,can&&!s.over)}${posBtn}</div>${ctrl}</section>${right}</div>`;
}

const findTeam=s=>{const n=String(s||'').toLowerCase().replace(/\s+/g,'');return n?KBO.find(t=>t.al.some(a=>n===a||n.startsWith(a)))||null:null};
function parseSong(path){ // "기아 - 삐끼삐끼.mp3" → {team:KIA, title:'삐끼삐끼'}
  const base=path.split('/').pop().replace(/\.(mp3|m4a|wav|mp4)$/i,'').trim();
  let m=base.match(/^(.+?)\s*[-–—_]\s*(.+)$/),team=m&&findTeam(m[1]);
  if(team)return {path,team,title:m[2].trim()};
  m=base.match(/^(\S+)\s+(.+)$/);team=m&&findTeam(m[1]); // "기아 삐끼삐끼"처럼 띄어쓰기만 한 경우
  if(team)return {path,team,title:m[2].trim()};
  return {path,team:findTeam(base),title:base};
}
const songSort=(a,b)=>((a.team?KBO.indexOf(a.team):99)-(b.team?KBO.indexOf(b.team):99))||a.title.localeCompare(b.title,'ko');
const songUrl=p=>p.split('/').map(encodeURIComponent).join('/');
function kboLogo(t){

  const img=KBO_IMG[t.short];
  if(img){const id=uid('kc'); // 실제 로고 그림: 흰 원 안에 넣고, 테두리는 구단 대표색
    return `<svg class="kbo-logo" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="42.5"/></clipPath></defs>
      <circle cx="50" cy="50" r="46" fill="#F8F9FA" stroke="${t.c1}" stroke-width="7"/>
      <image href="${img}" x="14" y="14" width="72" height="72" preserveAspectRatio="xMidYMid meet" clip-path="url(#${id})"/></svg>`}
  const s=t.short,ko=/[가-힣]/.test(s),fs=ko?34:s.length<=2?42:34;
  return `<svg class="kbo-logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="${t.c1}" stroke="${t.c2}" stroke-width="7"/>

    <text x="50" y="75" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="11" letter-spacing="1.3" fill="#fff" fill-opacity=".85">${t.nick}</text></svg>`;
}
let outAudio=null,lastSong=null,nowSong=null,songWarned=false,lastInning=null;
async function fetchSongs(){ // 저장 프로그램이 알려 주는 노래 목록. 못 받으면 null
  // ?t=1: 파일이 폴더에 들어온 때(t)도 받는다(새 등장곡 NEW 표시, 2026-11-03). 예전 저장 프로그램이면 이름만 와서 NEW 없이 그대로 된다
  try{const r=await fetch('api/songs?t=1',{cache:'no-store'});if(r.ok&&r.headers.get('X-SD-League'))return (await r.json()).map(x=>typeof x==='string'?parseSong(x):{...parseSong(String(x.p)),t:+x.t||0}).sort(songSort)}catch(e){}
  return null;
}
/* 이닝교대송(2026-10-03): 파일 이름에 "이닝교대"(또는 "공수교대")가 들어간 노래.
   3아웃(공수교대·경기 종료), [공수교대] 버튼, 경기 시작(PLAY BALL) 때 고르기 창 없이 저절로 나온다(여러 곡이면 번갈아 무작위).
   아웃송 고르기 창에는 나오지 않는다. */
const isInningSong=s=>/(이닝|공수)교대/.test(s.path.split('/').pop().replace(/\s+/g,''));
const isWalkup=s=>/^등장곡\//.test(s.path); // "등장곡" 폴더의 노래 = 타자 등장곡(2026-10-07)
const isMusic=s=>/^노래\//.test(s.path); // "노래" 폴더의 노래 = [🎵 노래 틀기]에만 나온다(2026-10-11)
const isFullCountSong=s=>/풀\s*카운트/.test(s.path.split('/').pop()); // 이름에 "풀카운트"가 들어간 노래(2026-11-12, 보통 "노래" 폴더)
async function songLists(){
  const all=await fetchSongs();
  if(!all){if(!songWarned){songWarned=true;toast('아웃송·이닝교대송·등장곡은 "야구기록 시작"으로 연 화면에서만 나와요. 검은 창을 껐다가 다시 켜 주세요.')}return null}
  return {outs:all.filter(s=>!isInningSong(s)&&!isWalkup(s)&&!isMusic(s)&&!isFullCountSong(s)),inning:all.filter(isInningSong),walk:markNewWalk(all.filter(isWalkup)),music:all.filter(isMusic),full:all.filter(isFullCountSong)};
}
/* 풀카운트송(2026-11-12 사용자 요청): 상대 팀 투수 경기는 쓰리볼 투스트라이크, 같은 팀 투수 경기는 투스트라이크가 되는 순간 저절로 나온다.
   파일 이름에 "풀카운트"가 들어간 노래(여러 곡이면 무작위, 방금 튼 곡 빼고). 풀카운트에서 파울이 나와도 다시 틀지 않는다.
   그 타석이 끝나면(등장곡처럼) 저절로 멈춘다. 파일이 없으면 아무 일도 없다. */
const isFullCount=(g,s)=>g.selfPitch?s.strikes===2:s.balls===3&&s.strikes===2;
let lastFull=null;
async function playFullCountSong(key){
  const L=await songLists();if(!L||!L.full.length||state.page!=='live')return;
  const g=curGame(),s=g&&sim(g);if(!s||s.over||!s.batter||[g.id,s.inning,s.top,s.batter.pid].join('|')!==key)return; // 그사이 타석이 끝났으면 안 튼다
  const c=L.full.length>1?L.full.filter(x=>x.path!==lastFull):L.full,x=c[Math.floor(Math.random()*c.length)];
  lastFull=x.path;playSong({...x,fc:true});
}
/* 새 등장곡 NEW 표시(2026-11-03 사용자 요청: 등장곡을 새로 넣으면 학생들이 알 수 있게).
   선생님은 예전처럼 "등장곡" 폴더에 mp3만 넣는다. 파일이 폴더에 들어온 날짜(만든 날짜)가 처음 넣은 등장곡들보다 하루 넘게 늦고,
   들어온 지 NEW_DAYS일이 안 됐으면 NEW다. 폴더를 통째로 복사한 컴퓨터(팀티칭 선생님)는 모든 파일 날짜가 같아서 NEW가 붙지 않는다.
   NEW 곡은 등장곡 창 맨 앞에 온다. 움직이는 빛은 넣지 않는다(사용자 결정). */
const NEW_DAYS=14,DAY_MS=86400000;
function markNewWalk(list){
  const ts=list.map(s=>s.t).filter(Boolean);if(!ts.length)return list;
  const first=Math.min(...ts),now=Date.now();
  list.forEach(s=>s.isNew=!!(s.t&&s.t-first>=DAY_MS&&now-s.t<NEW_DAYS*DAY_MS));
  return [...list.filter(s=>s.isNew),...list.filter(s=>!s.isNew)];
}
/* [🎵 노래 틀기](2026-10-11 사용자 요청): 경기 방송 칸 맨 아래. 등장곡 고르기 창처럼 카드를 누르면 바로 나온다.
   "노래" 폴더(선생님이 나중에 넣는 노래)가 위, "등장곡" 폴더 노래가 아래. 서버가 폴더를 그때그때 읽으므로 파일만 넣으면 다음에 열 때 나온다.
   여기서 튼 노래는 free 표시를 붙여 타석이 끝나도 멈추지 않고, 타자 소개도 기다리지 않는다(소개하는 동안 소리만 작게). 아웃송이 나오면 그 노래로 바뀐다 */
async function openMusic(){
  const L=await songLists();if(!L)return;
  if(!L.music.length&&!L.walk.length){toast('틀 노래가 없어요. 프로그램 폴더 안 "노래" 폴더에 mp3 파일을 넣어 주세요.');return}
  if(!$('#overlay').hidden)return;
  state.modal={type:'song',music:true,list:[...L.music,...L.walk],nm:L.music.length};

// 볼 판정 남자 목소리(2026-10-06): 엣지 인터넷 목소리 InJoon·Hyunsu(남자). 남자 목소리가 없으면(인터넷 안 됨, 크롬 등) 여자 목소리를 낮게(높이 .6) 쓴다.

function maleVoice(){
  if(annMale!==undefined)return annMale;
  const ko=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)&&(!annLocal()||v.localService));
  return annMale=ko.find(v=>/InJoon/i.test(v.name))||ko.find(v=>/Hyunsu|BongJin|GookMin|Male|남/i.test(v.name))||null;
}
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',()=>{annVoice=null;annMale=undefined});
function setDuck(on){annSpeaking=on;if(outAudio)outAudio.volume=on?DUCK:1}
let annBusy=false,annQueue=null; // annQueue: 지금 말하는 것(볼 판정)이 끝난 뒤 이어서 말할 것(타자 소개)
function annStop(){annRun++;clearTimeout(annTimer);if('speechSynthesis' in window)speechSynthesis.cancel();annBusy=false;setDuck(false)}
function speakParts(parts,opt={}){ // parts: [[문장, 빠르기, 높이, 다음 조각까지 쉬는 ms, 'm'이면 남자 목소리], ...]
  if(!('speechSynthesis' in window)||!parts.length)return;
  if(opt.after&&annBusy){annQueue={parts,opt:{...opt,after:false}};return} // after: 지금 말하는 것을 끊지 않고 끝난 뒤에
  annQueue=null;annStop();const run=annRun;annBusy=true;setDuck(true);
  // onDone: 끊기지 않고 끝까지 말했을 때 할 일(타자 소개 뒤 등장곡 고르기 창). 볼 판정 등으로 끊기면 하지 않는다
  const finish=()=>{if(run!==annRun)return;clearTimeout(annTimer);annBusy=false;setDuck(false);
    if(annQueue){const q=annQueue;annQueue=null;speakParts(q.parts,q.opt)}else if(opt.onDone)setTimeout(opt.onDone,250)};
  annTimer=setTimeout(finish,12000); // 끝 알림이 안 와도 노래 소리는 되돌린다
  const say=i=>{
    if(run!==annRun)return;
    if(i>=parts.length){finish();return}
    let [text,rate,pitch,gap,who]=parts[i],v=annVoice||(annVoice=annPickVoice());
    if(who==='m'){const m=maleVoice();if(m)v=m;else pitch*=.6}
    const u=new SpeechSynthesisUtterance(text);annUtt=u; // 붙잡아 두지 않으면 끝 알림이 안 오는 브라우저가 있다
    u.lang='ko-KR';try{if(v)u.voice=v}catch(e){}u.rate=rate;u.pitch=pitch;u.volume=1;
    let done=false;const next=()=>{if(done)return;done=true;clearTimeout(wd);setTimeout(()=>say(i+1),gap||0)};
    const wd=setTimeout(next,2500+text.length*450/rate); // 끝 알림이 안 와도 다음 조각으로 넘어간다
    u.onend=next;
    u.onerror=e=>{if(run!==annRun||e.error==='interrupted'||e.error==='canceled')return;
      done=true;clearTimeout(wd);
      if(v&&!v.localService&&!annLocalOnly){annLocalOnly=true;annVoice=null;annMale=undefined;say(i)} // 인터넷 목소리가 안 되면 컴퓨터 목소리로
      else finish()};
    try{speechSynthesis.speak(u)}catch(e){done=true;clearTimeout(wd);finish()} // 말하기 기능이 고장 나도 조용히 넘어간다
  };
  say(0);
}
/* ---------- 볼 판정 소리(2026-10-06, 사용자가 보낸 야구 게임 영상처럼) ----------
   학생들이 볼카운트를 헷갈려해서 [볼]·[스트라이크]·[파울]을 누를 때마다 남자 목소리로 "볼!"·"스트라이크!"·"파울!"을 외치고
   이어서 "원볼 투스트라이크"처럼 카운트를 읽는다(1=원, 2=투, 3=쓰리, 볼 0개는 "노볼", 스트라이크 0개는 말하지 않음 → "원볼", 쓰리볼 투스트라이크는 "풀카운트"까지).
   그 공으로 타석이 끝나면 카운트 대신 "볼넷!"·"삼진 아웃!"(같은 팀 투수 규칙이면 "볼 4개, 삼진 아웃!").
   볼 판정은 지금 나오는 말을 끊고 바로 말한다. 다음 타자 소개는 볼 판정이 끝난 뒤에 이어서 나온다(speakParts after).
   [볼카운트 소리 켬/끔]은 이 컴퓨터에만 기억한다(localStorage sd-league-umpire). */
const UMP_KEY='sd-league-umpire',CNT=['노','원','투','쓰리'];
function umpOn(){try{return localStorage.getItem(UMP_KEY)!=='off'}catch(e){return true}}
function umpSet(on){try{localStorage.setItem(UMP_KEY,on?'on':'off')}catch(e){}}
function pitchCall(g,s1,r){
  if(!umpOn()||state.readOnly)return;
  const call={B:'볼!',S:'스트라이크!',F:'파울!'}[r];if(!call)return;
  const ended=r!=='F'&&s1.balls===0&&s1.strikes===0; // 볼·스트라이크 뒤 카운트가 0-0이면 그 공으로 타석이 끝난 것
  const tail=ended?(r==='B'?(g.fourBallK?'볼 4개, 삼진 아웃!':'볼넷!'):'삼진 아웃!')
    :`${CNT[s1.balls]}볼${s1.strikes?` ${CNT[s1.strikes]}스트라이크`:''}${s1.balls===3&&s1.strikes===2?', 풀카운트!':''}`; // "노스트라이크"는 잘 안 써서 빼고 "원볼"처럼(사용자 요청). "노볼"은 쓴다
  speakParts([[call,1,1,0,'m'],[tail,1.05,1,0,'m']]);
}
function batterCall(g,s){ // 지금 타자 소개: "3번 타자, 우익수, 홍길동"(이닝이 막 시작됐으면 앞에 "1회초, 1학년 1반 공격.")
  if(!s||s.over||!s.batter)return [];
  const t=s.bt,lu=s.lu[t],pid=s.batter.pid,order=s.bi[t]%lu.length+1;
  const pos=(POSITIONS.find(([c])=>c&&c===s.pos[t][pid])||[])[1];
  // 부를 때 발음(2026-10-07 "유건을 유껀이라고 읽는다"): 선수 수정 창의 [방송 발음]에 적어 두면 그 글자로 읽는다(예: "유 건")
  const name=findPlayer(pid)?.p?.say||gObj(g,s,pid).name||s.batter.name||'';
  // 조각을 따로 말하면 사이가 너무 떠서(사용자 의견) 한 문장으로 쉼표만 두고 보통 사람 말 빠르기(1)로 말한다.
  // 이닝 시작(2026-10-06 사용자 요청, 야구장처럼): 공격이 막 시작됐으면 "1회초, 1학년 1반 공격." 다음 곧바로 타자 소개를 같은 문장으로 이어 말한다.
  // 팀 이름 끝의 " 남"/" 여"는 소리로는 빼고 읽는다("1학년 1반 남" → "1학년 1반 공격", 2026-10-15 사용자 요청). 청팀·백팀은 그대로
  const tn=String(g.teams[t]?.name||'').replace(/\s+[남여](?=\s|$)/g,'');
  const half=halfJustStarted(s)?`${s.inning}회${s.top?'초':'말'}, ${tn} 공격. `:'';
  return [[half+[`${order}번 타자`,pos,name].filter(Boolean).join(', '),1,1.05,0]];
}
// 이번 공격(초·말)이 막 시작됐는지: 문자중계 기록의 마지막 "○회초 ○○ 공격" 줄 뒤에 아직 타석이 하나도 없으면 막 시작된 것
function halfJustStarted(s){for(let i=s.log.length-1;i>=0;i--){const k=s.log[i].k;if(k==='bat'&&!s.log[i].skip)return false;if(k==='half')return true}return false}
let annLast=''; // 마지막으로 저절로 부른 타석(같은 타석을 두 번 부르지 않게). 되돌리기 하면 비운다.
function announceBatter(force){
  if(!force&&!annOn())return;
  const g=curGame();if(!g||state.page!=='live'||state.readOnly)return;
  const s=sim(g);if(!s.batter||s.over)return;
  const key=[g.id,s.inning,s.top,s.bi[s.bt],s.batter.pid].join('|');
  if(!force&&key===annLast){ // 이미 부른 타자(기록 창이 떠 있는 동안 미리 부른 경우 포함)
    if(annPrev?.key===key){if(annPrev.done)walkupPicker(key);annPrev=null} // 미리 부르기가 끝났으면 이제 등장곡 창(아직 말하는 중이면 끝날 때 뜬다)
    return}
  annLast=key;speakParts(batterCall(g,s),{after:!force,onDone:()=>walkupPicker(key)}); // 저절로 부를 때는 볼 판정 소리가 끝난 뒤에. 다 부르면 등장곡 창
}
/* 다음 타자 미리 부르기(2026-10-15 사용자 요청: 학생들이 "주자가 어디까지 갔나요?"·"누가 수비 성공을 했나요?" 창을 오래 눌러서
   아웃송이 끝나도 다음 타자 소개가 안 나와 경기 흐름이 끊김).
   [땅볼 아웃]·[뜬공 아웃]을 누르면(annPrev) 그 창이 떠 있는 동안 아웃송이 끝나거나 [■ 멈추기]를 누르면,
   "타자 아웃, 주자 그대로"로 셈한 다음 타자를 바로 부른다(3아웃이면 "n회말 ○반 공격."부터).
   창을 다 채워 기록하면 진짜 다음 타자가 같으면 다시 부르지 않고 등장곡 창만 띄운다. 병살 등으로 다르면 진짜 타자를 새로 부른다 */
let annPrev=null;
function annTryPreview(){
  const p=annPrev;if(!p||p.key||state.page!=='live'||state.readOnly||!annOn())return;
  if($('#overlay').hidden||!['play','def'].includes(state.modal?.type)||songBusy())return;
  const g=curGame();if(!g||g.id!==p.gid)return;
  // 아직 기록하지 않은 이번 아웃을 넣어 본 경기. 주자 창에서 이미 고른 진루(병살 등)가 있으면 그것까지 넣어 셈한다
  const m=state.modal,ev=m.type==='def'&&m.ev?{...m.ev}:{type:'pa',r:p.r,...(m.mv?{moves:{...m.mv}}:{})};
  const hg={...g,id:g.id+'~next',events:[...g.events,ev]},hs=sim(hg);
  if(!hs.batter||hs.over)return;
  const key=[g.id,hs.inning,hs.top,hs.bi[hs.bt],hs.batter.pid].join('|');
  if(key===annLast)return;
  p.key=key;annLast=key;
  speakParts(batterCall(hg,hs),{after:true,onDone:()=>{p.done=true;walkupPicker(key)}}); // 기록 창이 아직 떠 있으면 등장곡 창은 뜨지 않는다(walkupPicker가 확인)
}
// 저절로 부르는 타자 소개는 노래와 겹치지 않게 기다린다. annHold: 이닝교대송·아웃송을 트는 중(파일 목록을 받는 동안)
let annPending=false,annHold=0;
function songBusy(){
  const picking=state.modal?.type==='song'&&!$('#overlay').hidden;
  const playing=!!(outAudio&&!outAudio.paused&&!outAudio.ended&&!outAudio.error&&!nowSong?.free); // [노래 틀기]로 튼 노래는 기다리지 않는다
  return annHold>0||picking||playing;
}
function annRequest(delay){annPending=true;setTimeout(annTry,delay||0)}
function annTry(){ // 기다리던 타자 소개를 부를 수 있으면 부른다. 노래가 끝날 때, 창이 닫힐 때 다시 불린다
  if(!annPending){annTryPreview();return} // 땅볼·뜬공 기록 창이 떠 있는 동안이면 다음 타자를 미리 부른다
  if(state.page!=='live'){annPending=false;return}
  if(songBusy())return;
  annPending=false;announceBatter();
}
function handlePA(r){
  const g=curGame();if(!g)return;const s=sim(g);if(s.over)return;
  const has=[1,2,3].some(i=>s.bases[i]);
  if(r==='FC'&&!has){toast('야수선택은 주자가 있을 때만 쓸 수 있어요.');return}
  annPrev=DEF_R.includes(r)?{gid:g.id,r}:null; // 땅볼·뜬공: 기록 창이 떠 있는 동안 아웃송이 끝나면 다음 타자를 미리 부른다
  if(OUTR.includes(r))earlyOutSong(s); // 삼진·땅볼·뜬공: 누르자마자 아웃송
  if(r==='E'||r==='FC'||(has&&['1B','2B','3B','GO','FO','SF'].includes(r)))openPlay(r);
  else if(DEF_R.includes(r))openDef({type:'pa',r});
  else addEvent({type:'pa',r});
}
function addEvent(ev){
  const g=curGame();if(!g)return;
  const s0=sim(g);if(s0.over)return;
  const before={bases:[...s0.bases],batter:s0.batter,logLen:s0.log.length,inning:s0.inning,top:s0.top,full:isFullCount(g,s0)};
  g.events.push(ev);commitGame(g);
  const runMs=animateMoves(g,before,ev)||0,s1=sim(g),wait=Math.max(450,runMs);
  if(ev.type==='pitch')try{pitchCall(g,s1,ev.r)}catch(e){} // "볼!" + "원볼 투스트라이크". 소리에 문제가 생겨도 기록은 계속
  // 이 공으로 풀카운트가 됐으면(같은 타자, 방금 전엔 풀카운트가 아니었음) 풀카운트송
  if(ev.type==='pitch'&&!state.readOnly&&!s1.over&&s1.batter&&s1.batter.pid===before.batter?.pid&&s1.inning===before.inning&&s1.top===before.top&&!before.full&&isFullCount(g,s1))
    playFullCountSong([g.id,s1.inning,s1.top,s1.batter.pid].join('|'));
  // 이번 기록으로 아웃이 나왔는지(삼진·땅볼·뜬공·주루사·견제사 등), 그 아웃으로 공수가 바뀌었거나 경기가 끝났는지
  const outs=s1.log.slice(before.logLen).filter(e=>/^out/.test(e.k));
  const halfOver=s1.over||s1.inning!==before.inning||s1.top!==before.top;
  // 타석이 끝나면(다음 타자·공수교대·경기 종료) 나오던 등장곡을 멈춘다. 그래야 아웃송·다음 타자 소개가 등장곡을 기다리지 않는다
  // 삼진·땅볼·뜬공 버튼을 눌렀을 때 이미 노래를 틀었으면(earlyOutSong) 여기서는 다시 틀지 않는다
  const early=songEarly&&ev.type==='pa'&&OUTR.includes(ev.r)&&Date.now()-songEarly<600000;songEarly=0;
  if(nowSong&&(isWalkup(nowSong)||nowSong.fc)&&!nowSong.free&&outAudio&&!outAudio.paused&&(halfOver||s1.batter?.pid!==before.batter?.pid))stopSong();
  if(early){}
  else if((outs.length&&halfOver)||ev.type==='half'){
    // 3아웃·[공수교대] 버튼 → 주자가 다 달린 뒤 이닝교대송. 이닝교대송 파일이 없으면 3아웃은 아웃송
    annHold++; // 노래를 트는 동안(파일 목록을 받는 동안) 타자 소개는 기다린다
    setTimeout(async()=>{try{if(await playInningSong())return;if(outs.length)await playOutSong()}finally{annHold--;annTry()}},wait);
  }else if(outs.length){
    // 1아웃·2아웃(볼카운트 삼진, 주루사, 견제사 등) → 아웃송 무작위
    annHold++;
    setTimeout(async()=>{try{await playOutSong()}finally{annHold--;annTry()}},wait);
  }
  // 타자가 바뀌었으면(타석 끝, 공수교대, 대타) 다음 타자를 불러 준다.
  // 아웃송·이닝교대송이 나오는 중이면, 노래가 끝난 뒤(또는 ■ 멈추기)에 부른다.
  if(s1.batter&&!s1.over&&(s1.batter.pid!==before.batter?.pid||halfOver))annRequest(wait+300);
}
function commitGame(g){
  g.rev=(g.rev||0)+1;const s=sim(g);
  if(s.over){g.status='final';if(!g.endedAt)g.endedAt=Date.now()}else{g.status='live';delete g.endedAt}
  g.score=s.score;persist('games',g);render();
}

    // 원정팀 이름-로고 | 점수 | 로고-홈팀 이름 순서로 점수 가까이 붙여서 한눈에 읽히게

  }
  if(R.tab==='rank')return head+tabs+`<div class="stack">${standingsPanels()}</div>
    <p class="hint" style="margin-top:8px">경기 설정의 경기 구분(여학생·남학생·혼성)에 따라 순위를 따로 매겨요. 진행 중인 경기는 지금 점수로 끝난다면 어떻게 되는지로 계산해요(동점이면 무). 최근 경기 칸의 점선 칸이 진행 중인 경기예요.</p>`;
  if(R.tab==='ability'){
    const rc=findCls(R.cls)||classes()[0];
    const cols=[['OVR','종합'],...STAT_KEYS.map(k=>[k,statLabel(rc,k)])];
    let sk=R.sort;if(!cols.find(c=>c[0]===sk))sk='OVR';
    const val=(r,k)=>k==='OVR'?r.o.avg:statPts(r.p,k);
    const rows=[];for(const c of classes())if(!R.cls||c.id===R.cls)for(const p of c.players||[]){const o=overall(p);if(o)rows.push({p,c,o})}
    rows.sort((a,b)=>((val(b,sk)??-1)-(val(a,sk)??-1))||(b.o.avg-a.o.avg));
    const cell=(r,k)=>{if(k==='OVR')return `<span class="L ${gcls(r.o.letter)}" style="font-size:20px">${r.o.letter}</span> <small class="hint">${r.o.avg.toFixed(2)}</small>`;
      const l=statLetter(r.p,k);return l?`<span class="L ${gcls(l)}" style="font-size:18px">${l}</span>`:'<span class="hint">-</span>'};
    return head+tabs+filter+`<section class="panel">${rows.length?`<div class="tbl-wrap"><table class="tbl bx"><thead><tr><th>순위</th><th>선수</th><th>학급</th>${cols.map(([k,n])=>`<th class="num"><button data-sort="${k}" aria-pressed="${sk===k}">${esc(n)}</button></th>`).join('')}</tr></thead><tbody>
      ${rows.map((r,i)=>`<tr class="click" data-player="${esc(r.p.id)}"><td class="L" style="font-size:17px">${i+1}</td><td class="strong">${pCell(r.p.id,r.p.name)}</td><td>${tCell(r.c.id,r.c.name)}</td>${cols.map(([k])=>`<td class="num">${cell(r,k)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">아직 능력치를 입력한 선수가 없어요. 선수관리에서 PAPS 등급을 입력해 보세요.</div>'}</section><p class="hint" style="margin-top:8px">능력치를 하나라도 입력한 선수만 나와요. 표 제목을 누르면 그 능력치 순으로 정렬돼요.</p>`;
  }
  const bat=R.tab==='bat';
  let rows=Object.values(bat?se.bat:se.pit).filter(r=>findPlayer(r.pid)&&(!R.cls||r.classId===R.cls)); // 지운 선수는 빼고(2026-10-06 요청)
  const cols=bat?[['G','경기'],['PA','타석'],['AB','타수'],['H','안타'],['D','2루타'],['T','3루타'],['HR','홈런'],['RBI','타점'],['R','득점'],['DF','수비<br><small>성공</small>'],['BB','볼넷'],['K','삼진'],['E','실책'],['AVG','타율'],['OBP','출루율'],['OPS','OPS<br><small>출루율+장타율</small>']]
    :[['G','경기'],['O','이닝'],['NP','투구수'],['H','피안타'],['HR','피홈런'],['R','실점'],['BB','볼넷'],['K','삼진']];
  let sk=R.sort;if(!cols.find(c=>c[0]===sk))sk=bat?'AVG':'K';
  rows.sort((a,b)=>((b[sk]??-1)-(a[sk]??-1)));

  const tdc=(r,k)=>VC[k]&&bat?(r[k]?VC[k]:VC[k]+'0'):'';
  const fmt=(r,k)=>bat&&k==='AVG'?(r.AVG==null?'<span class="avg avg-n">-</span>':`<span class="avg sm ${r.AVG>=.5?'avg-g':r.AVG>=.3?'avg-s':'avg-b'}">${r.AVG.toFixed(3).replace(/^0/,'')}</span>`):k==='OPS'?(r[k]==null?'-':r[k].toFixed(3)):k==='AVG'||k==='OBP'?(r[k]==null?'-':r[k].toFixed(3).replace(/^0/,'')):k==='O'?ip(r.O):r[k];
  return head+tabs+filter+`<section class="panel">${rows.length?`<div class="tbl-wrap"><table class="tbl bx"><thead><tr><th>순위</th><th>선수</th><th>학급</th>${cols.map(([k,n])=>`<th class="num ${HC[k]||''}"><button data-sort="${k}" aria-pressed="${sk===k}">${n}</button></th>`).join('')}</tr></thead><tbody>
    ${rows.map((r,i)=>{const c=findCls(r.classId);return `<tr class="click" data-player="${esc(r.pid)}"><td class="L" style="font-size:17px">${i+1}</td><td class="strong">${pCell(r.pid,r.name)}</td><td>${c?tCell(c.id,c.name):''}</td>${cols.map(([k])=>`<td class="num ${k===sk?'strong':''} ${tdc(r,k)}">${fmt(r,k)}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></div>`:'<div class="empty">아직 기록이 없어요. 경기가 끝나면 여기에 쌓여요.</div>'}</section><p class="hint" style="margin-top:8px">표 제목을 누르면 그 기록 순으로 정렬돼요.</p>`;
}

function saveEdit(base,isNew,cls){

/* ---------- 팝스 기록 넣기(2026-10-18 사용자 요청: 공유판 선생님들이 나이스 "학급별 건강체력평가 조회" 엑셀을 넣으면 선수가 저절로 생기게) ----------
   여러 반 파일을 한 번에 고를 수 있다. xlsx는 압축 파일이라 브라우저 기본 기능(DecompressionStream)으로 풀어 표를 읽는다(다른 프로그램 없음).
   표 모양(2026-10-06 1학년 파일과 같음): "2026 학년도 주간 3 학년 1 반" 제목 → "번호·성명·…·심폐지구력·유연성·근력·근지구력·순발력·비만" 줄 →
   그 아래 줄에 종목 이름(단위)·점수·등급 → 학생 줄. 쪽마다 제목·머리줄이 다시 나온다.
   심폐지구력→stamina, 유연성→flex, 근력·근지구력→power, 순발력→speed. 기록이 있는 종목 이름·기록(단위 붙임)·등급(1~5)을 넣는다.
   학급은 이름("3학년 1반")으로 찾고 없으면 만든다. 학생은 같은 반에서 이름+번호(또는 이름이 하나뿐이면 이름)로 찾아 팝스만 바꾸고, 없으면 새로 만든다(반티는 그 반 반티).
   넣기 전에 반마다 "새 학생 몇 명, 팝스만 바꿀 학생 몇 명"을 보여 주고 확인을 받는다. 지우는 학생은 없다. */
const PAPS_GROUP=[[/심폐/,'stamina'],[/유연/,'flex'],[/근력|근지구력/,'power'],[/순발/,'speed']];
const colIdx=c=>[...c].reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);
async function unzipXlsx(buf){ // 필요한 xml만 꺼낸다: 공유 글자표, 시트들
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('엑셀(xlsx) 파일이 아니에요.');
  const out={},cnt=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;

const luStep=(n,txt,done)=>`<h5 class="mh sub-step${done?' done':''}"><b>${n}</b> ${txt}</h5>`;

function subBench(g,s,t){
  // 지금 뛰고 있는 선수와, 이 경기에서 상대 팀으로 뛴 선수는 뺀다(우리 팀에서 나갔던 선수는 다시 들어올 수 있음)
  const inLu=new Set(s.lu.flatMap(l=>l.map(e=>e.pid)));
  return (findCls(g.teams[t].classId)?.players||[]).filter(p=>!inLu.has(p.id)&&!(s.M[p.id]&&s.M[p.id].team!==t)).sort((x,y)=>(+x.number||999)-(+y.number||999));
}
// 선수 교체: ① 나가는 선수 → ② 들어오는 선수 → 교체하기
function subBody(g,s,t,m){
  const bench=subBench(g,s,t),vest=g.teams[t].vest||'';
  const op=m.out&&gObj(g,s,m.out),ip=m.in&&findPlayer(m.in)?.p,opos=m.out&&s.pos[t][m.out];
  const step=luStep;
  return `${step('①','나가는 선수를 누르세요',!!m.out)}${pickGrid(g,s,t,m.out,'sub-out',true)}
    ${step('②','들어오는 선수를 누르세요',!!m.in)}
    ${bench.length?`<div class="pick-grid">${bench.map(p=>`<button type="button" class="pick" data-act="sub-in" data-pid="${esc(p.id)}" aria-pressed="${m.in===p.id}">${jersey({...p,vest},overall(p)?.letter,false)}<small>${esc(p.name)}</small></button>`).join('')}</div>`
      :`<p class="hint">들어갈 수 있는 선수가 없어요. 이 학급 선수가 모두 경기에 나와 있어요.</p>`}
    <div class="sub-sum">${op&&ip?`<b>${esc(op.name)}</b>${opos?` (${esc(posName(opos))})`:''} 나가고 → <b>${esc(ip.name)}</b> 들어와요<small>들어온 선수가 같은 타순, 같은 수비 위치를 이어받아요.</small>`:'두 선수를 모두 고르면 교체할 수 있어요.'}</div>
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button><button class="btn go" data-act="sub-ok" ${op&&ip?'':'disabled'}>교체하기</button></div></div>`;
}

/* 경기 설정(2026-10-14 사용자 요청: 경기 구분·투수 방식은 경기를 시작하면 못 바꿨음). 점수판 위 줄 [⚙️ 경기 설정].
   경기 구분(남학생/여학생/혼성), 투수(상대 팀/같은 팀, 같은 팀이면 볼 4개 = 삼진), 이닝 수(진행 중일 때만, 지금 이닝보다 적게는 못 함)를 바꾼다.
   투수 방식을 바꾸면 지난 기록도 처음부터 그 방식이었던 것처럼 다시 계산된다(sim이 g.selfPitch·g.fourBallK로 처음부터 다시 셈) */
function openGameSet(){

function gameSetBody(){
  const m=state.modal,g=curGame(),s=sim(g),N=g.innings||5;
  const seg=(act,v,on,txt)=>`<button type="button" class="seg" data-act="${act}" data-v="${v}" aria-pressed="${on}">${txt}</button>`;
  return `<div class="f" style="margin-bottom:14px"><span>경기 구분</span><div class="segs" style="margin-top:4px">${GTYPES.map(x=>seg('gs-gtype',x,m.gtype===x,x)).join('')}</div></div>
    <div class="f" style="margin-bottom:14px"><span>투수</span><div class="segs" style="margin-top:4px">${seg('gs-self',0,!m.self,'상대 팀 투수')}${seg('gs-self',1,m.self,'같은 팀 투수')}</div>
      <p class="hint" style="margin:6px 0 0">같은 팀 투수 경기는 볼 4개가 삼진이에요.</p></div>
    ${s.over?(N>=9?`<p class="hint">끝난 경기예요 (${N}이닝).</p>`:`<label class="f" style="margin-bottom:6px">이닝 수<select data-set="gsinn">${Array.from({length:10-N},(_,k)=>N+k).map(n=>`<option value="${n}" ${m.inn===n?'selected':''}>${n}이닝${n===N?' (지금)':''}</option>`).join('')}</select></label>
      ${m.inn>N?`<div class="sub-sum" style="margin-top:6px"><b>끝난 경기를 다시 이어서 해요.</b><small>${m.inn}이닝 경기로 바뀌고, 경기가 끝난 곳부터 이어서 기록할 수 있어요.</small></div>`:`<p class="hint" style="margin:0">이닝 수를 늘리면 끝난 경기를 이어서 할 수 있어요.</p>`}`)
    :`<label class="f" style="margin-bottom:6px">이닝 수<select data-set="gsinn">${Array.from({length:10-s.inning},(_,k)=>s.inning+k).map(n=>`<option value="${n}" ${m.inn===n?'selected':''}>${n}이닝${n===N?' (지금)':''}</option>`).join('')}</select></label>
      ${s.inning>1?`<p class="hint" style="margin:0">지금 ${s.inning}회라서 ${s.inning}이닝보다 적게는 고를 수 없어요.</p>`:''}`}
    ${m.self!==!!g.selfPitch?`<div class="sub-sum"><b>투수 방식을 바꿔요.</b><small>지금까지 기록도 처음부터 ${m.self?'같은 팀 투수(볼 4개 = 삼진)':'상대 팀 투수(볼 4개 = 볼넷)'} 경기였던 것처럼 다시 계산돼요. 투수 기록과 볼 4개 결과가 달라질 수 있어요.</small></div>`:''}
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button><button class="btn go" data-act="gs-ok">저장</button></div></div>`;
}
function confirmGameSet(){
  const m=state.modal,g=curGame();if(!g||!m)return;
  // 끝난 경기는 이닝 수를 늘리기만 할 수 있다(2026-11-13 사용자 요청: 5이닝으로 끝난 경기를 9회까지 이어서). 늘리면 경기가 다시 진행 중이 된다
  const N=g.innings||5,s=sim(g),inn=s.over?Math.max(N,Math.min(9,m.inn||N)):Math.max(s.inning,Math.min(9,m.inn||5));
  const same=(g.gtype||'')===m.gtype&&!!g.selfPitch===m.self&&N===inn;
  closeModal();if(same)return;
  if(m.gtype&&m.gtype!==g.gtype)refreshTeamNames(g.teams,m.gtype); // 경기 구분을 바꾸면 자동 모양 팀 이름의 " 남"/" 여"도 따라 바꾼다
  if(m.gtype)g.gtype=m.gtype;g.selfPitch=m.self;g.fourBallK=m.self;g.innings=inn;
  const reopen=s.over&&inn>N;
  if(reopen)while(g.events.length&&g.events[g.events.length-1].type==='end')g.events.pop(); // [경기 종료]로 끝냈으면 그 표시도 뺀다
  commitGame(g);
  const s2=sim(g);
  if(reopen&&!s2.over){toast(`${inn}이닝 경기로 바꿨어요. 이어서 기록하세요.`);annRequest(300)} // 다음 타자 소개
  else if(reopen)toast(`${inn}이닝으로 바꿨지만 점수 때문에 경기는 그대로 끝난 상태예요.`);
  else toast('경기 설정을 바꿨어요.');
}
/* 타순 바꾸기(2026-10-11 사용자 요청: 학생이 자기 차례보다 먼저 쳐 버리는 일이 생김). 2026-10-13부터 [라인업 수정] 창의 탭.
   두 선수를 차례로 누르면 둘의 타순 자리를 맞바꾼다. 지금 타석 자리에 들어온 선수가 곧바로 지금 타자가 되고, 타자 소개도 다시 나온다 */
function orderBody(g,s,t,m){

    <div class="pick-grid">${lu.map((e,k)=>{const p=gObj(g,s,e.pid),on=m.a===e.pid||m.b===e.pid;
      return `<button type="button" class="pick ord${e.pid===now?' now':''}" data-act="ord-pick" data-pid="${esc(e.pid)}" aria-pressed="${on}"><span class="ord-no">${k+1}</span>${e.pid===now?'<span class="ord-now">타석</span>':''}${jersey(p,overall(p)?.letter,false)}<small><b>${esc(p.name||e.name)}</b></small></button>`}).join('')}</div>
    <div class="sub-sum">${m.a&&m.b?`<b>${nm(m.a)}</b> ${slot(m.a)}번 ↔ <b>${nm(m.b)}</b> ${slot(m.b)}번, 자리를 바꿔요.${now?`<small>바꾸면 지금 타자는 ${nm(after)} 선수예요.</small>`:''}`:m.a?`<b>${nm(m.a)}</b> 선수와 자리를 바꿀 선수를 누르세요.`:'아직 고른 선수가 없어요.'}</div>
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button><button class="btn go" data-act="ord-ok" ${m.a&&m.b?'':'disabled'}>바꾸기</button></div></div>`;
}
function confirmOrder(){

/* ---------- 수비 성공 (수행평가용, 2026-10-02) ----------
   땅볼·뜬공·희생플라이 아웃이 나오면 "누가 수비 성공을 했나요?" 창에서 수비팀 선수를 여러 명 고른다.
   고른 선수마다 그 경기 "수비" 기록이 1씩 올라간다(pa 이벤트의 def 배열). */
const DEF_R=['GO','FO']; // 희생플라이 버튼은 없앴다(뜬공 아웃에 포함, 2026-10-02). 예전 기록의 SF는 계산만 그대로 된다.
function openDef(ev){
  state.modal={type:'def',ev,sel:[]};
  openModal('누가 수비 성공을 했나요?',defBody());
  state.modal.type='def';
}
function defBody(){
  const m=state.modal,g=curGame(),s=sim(g),t=s.ft;
  return `<p class="hint" style="margin:0 0 10px"><b>${RES[m.ev.r]}</b>예요. 공을 잡거나 아웃시킨 선수를 <b>모두</b> 누르세요. 여러 명을 고를 수 있고, 한 번 더 누르면 빠져요.</p>
    <div class="pick-grid">${s.lu[t].map(e=>{const p=gObj(g,s,e.pid),ps=s.pos[t][e.pid],on=m.sel.includes(e.pid);
      return `<button type="button" class="pick def" data-act="def-pick" data-pid="${esc(e.pid)}" aria-pressed="${on}">${on?'<span class="def-ck">✓</span>':''}${jersey(p,overall(p)?.letter,false)}<small>${ps?posName(ps):esc(e.name)}</small></button>`}).join('')}</div>
    <div class="sub-sum">${m.sel.length?`<b>${m.sel.map(pid=>esc(s.M[pid]?.name||'')).join(', ')}</b> 수비 +1점`:'아직 고른 선수가 없어요.'}</div>
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button><button class="btn go" data-act="def-ok">${m.sel.length?`확인 (${m.sel.length}명)`:'고르지 않고 기록'}</button></div></div>`;
}
function confirmDef(){const m=state.modal,ev={...m.ev};if(m.sel.length)ev.def=[...m.sel];closeModal();addEvent(ev)}
function confirmPlay(){
  const m=state.modal,g=curGame(),s=sim(g),occ={};
  const who=['b',1,2,3].filter(k=>k==='b'||s.bases[k]);
  for(const k of who){const d=k==='b'&&OUTR.includes(m.r)?0:m.mv[k];if(d>=1&&d<=3){if(occ[d]){$('#mvErr').textContent=`${d}루에 두 명이 있을 수 없어요.`;return}occ[d]=1}}
  if(m.r==='E'&&!m.f){$('#mvErr').textContent='실책한 선수를 골라 주세요.';return}
  const mv={};who.forEach(k=>mv[k]=m.mv[k]);
  const ev={type:'pa',r:m.r,moves:mv};if(m.f)ev.f=m.f;
  closeModal();if(DEF_R.includes(m.r))openDef(ev);else addEvent(ev);
}
/* ---------- 기록 고치기 (2026-10-26 사용자 요청, 10-27 줄임) ----------
   끝난 경기에서 [✏️ 기록 고치기]를 누르면 [라인업, 기록]의 수비 칸에 [−][+]가 생긴다(g.dfAdj {선수 id: 더하거나 뺀 수}, sim이 마지막에 더한다).
   선생님이 경기 뒤에 기억한 수비 성공 횟수를 넣는 용도다. 타석마다 [✏️ 고치기]·학생 [바꾸기]는 10-27 사용자 요청("필요 없다")으로 뺐다. */
function openNews(){
  openModal('소식 쓰기',`<form id="newsForm"><label class="f">제목<input type="text" name="title" maxlength="60" placeholder="예: 다음 주 리그 일정 안내"></label>
    <label class="f" style="margin-top:10px">내용<textarea name="body" placeholder="내용을 적어 주세요"></textarea></label><p class="err" id="formErr"></p>
    <div class="foot"><div class="r"><button type="button" class="btn" data-act="close">취소</button><button class="btn go" type="submit">올리기</button></div></div></form>`);
  $('#newsForm').onsubmit=e=>{e.preventDefault();const el=e.target.elements,t=el.title.value.trim();if(!t){$('#formErr').textContent='제목을 입력해 주세요.';return}
    const n={id:uid('n'),title:t,body:el.body.value.trim(),createdAt:Date.now()};state.data.news.unshift(n);persist('news',n);closeModal();render();toast('소식을 올렸어요.')};
}

/* ================= 토너먼트(2026-11-05 사용자 요청) =================
   3학년 폴더판을 먼저 만들고 같은 날 1학년 프로그램에도 넣었다. 3학년 폴더판은 build-folder.ps1이 이 파일을 복사해서 만든다.
   기록: state.data.tournaments = [{id,name,fmt,gtype,createdAt,rev,size,slots,ov,res,girls,direct}]
     size: 칸 수. slots: 첫 라운드 칸(팀 {classId,name} 또는 null=부전승). 첫 라운드 i경기 = slots[2i], slots[2i+1].
     res['라운드-경기']: {gid(연결된 경기), w(교사가 고른 승자 0/1), a,b(직접 쓴 점수)}. 승자가 올라가는 것은 저장하지 않고 그때그때 계산한다.
     ov['라운드-경기-칸']: 교사가 다음 라운드 칸에 직접 넣은 팀(null=빈칸). 있으면 이긴 팀 대신 이 팀이 그 칸에 있다.
   승자 고르는 순서: 교사가 고른 승자 → 연결된 경기 점수(끝난 경기만) → 직접 쓴 점수. 경기를 되돌리면 대진표도 저절로 되돌아간다.
   fmt 없음: 일반 토너먼트(2·4·8·16칸).
   fmt:'f3'(수업 방식): 12칸. 라운드 0=예선 1라운드(6경기), 1=예선 2라운드(3경기), 그다음 파이널 라운드(3팀, 경기 없음), 2=준결승, 3=결승.
     파이널 3팀 중 예선 2라운드 득실이 가장 큰 팀이 결승으로 바로 가고, 나머지 두 팀이 준결승을 한다(tnFinal). 1라운드 득실은 보지 않는다(사용자 결정).
     득실이 같으면 2라운드에 여학생이 더 많이 참여한 반이 올라간다. 학생 성별은 프로그램에 없어서 교사가 숫자로 넣는다(t.girls {팀 이름: 수}).
     그것도 같으면 교사가 고른다(t.direct = 팀 이름, 고르면 자동 계산보다 앞선다).
   토너먼트 경기(g.tn={tid,key})는 리그 순위에 넣지 않는다. 선수 개인 기록에는 들어간다. 토너먼트를 지우면 다시 리그 순위에 들어간다. */
const TN_BYE='__bye__';
const TN_ICON='<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 2h10v1.500h3V7a3 3 0 0 1-3 3h-.4A5 5 0 0 1 11 12.900V15h3v3H6v-3h3v-2.100A5 5 0 0 1 5.400 10H5a3 3 0 0 1-3-3V3.500h3zm0 3H3.500V7A1.500 1.500 0 0 0 5 8.500zm10 0v3.500A1.500 1.500 0 0 0 16.500 7V5z"/></svg>';
const TN_F3=['예선 1라운드','예선 2라운드','준결승','결승'],isF3=t=>t.fmt==='f3';
const tns=()=>state.data.tournaments||(state.data.tournaments=[]);
const tnFind=id=>tns().find(t=>t.id===id)||null;
const tnCur=()=>tnFind(state.tnId)||tns()[0]||null;
const tnOf=g=>g&&g.tn?tnFind(g.tn.tid):null;
const tnRounds=t=>isF3(t)?4:Math.round(Math.log2(t.size));
const tnRoundName=(t,r)=>{if(isF3(t))return TN_F3[r];const n=t.size>>r;return n===2?'결승':`${n}강`};
const tnGame=id=>id?state.data.games.find(g=>g.id===id)||null:null;
const tnKeyName=(t,key)=>{const [r,i]=String(key).split('-').map(Number);return tnRoundName(t,r)+((isF3(t)?r<2:t.size>>r>2)?` ${i+1}경기`:'')};
const tnSign=n=>n>0?'+'+n:n<0?'−'+(-n):'0';
function tnSave(t){t.rev=(t.rev||0)+1;persist();render()}
// 연결된 경기 점수를 대진표 위·아래 팀 순서로
function tnScore(A,B,g){const s=sim(g).score,t0=g.teams[0],t1=g.teams[1],flip=!!A&&A!==TN_BYE&&t0.name!==A.name&&(t1.name===A.name||(!!A.classId&&t1.classId===A.classId&&t0.classId!==A.classId));return flip?[s[1],s[0]]:[s[0],s[1]]}
function tnSide(t,r,i,A,B){
  const x=t.res[`${r}-${i}`];if(!x)return null;
  if(x.w===0||x.w===1)return x.w;
  const g=tnGame(x.gid);
  if(g){if(g.status!=='final')return null;const [a,b]=tnScore(A,B,g);return a===b?null:a>b?0:1}
  if(x.a==null||x.b==null||x.a===''||x.b===''||+x.a===+x.b)return null;
  return +x.a>+x.b?0:1;
}
function tnSlot(t,r,i,s){
  if(r===0)return t.slots[2*i+s]||TN_BYE;
  const k=`${r}-${i}-${s}`;if(k in t.ov)return t.ov[k]||TN_BYE;
  if(isF3(t)&&r===2){const f=tnFinal(t);return f.semi?f.semi[s]:null} // 준결승: 파이널 3팀 중 직행 못 한 두 팀
  if(isF3(t)&&r===3)return s?tnWin(t,2,0):tnFinal(t).direct||null; // 결승: 위 칸 직행 팀, 아래 칸 준결승 승자
  return tnWin(t,r-1,2*i+s);
}
function tnWin(t,r,i){ // 이 경기에서 올라가는 팀. 아직 모르면 null, 두 칸 다 비었으면 TN_BYE
  const A=tnSlot(t,r,i,0),B=tnSlot(t,r,i,1);
  if(A===TN_BYE&&B===TN_BYE)return TN_BYE;
  if(A===TN_BYE)return B;if(B===TN_BYE)return A;if(!A||!B)return null;
  const w=tnSide(t,r,i,A,B);return w==null?null:w?B:A;
}
// 이 경기와 그 뒤로 이어지는 경기들. f3는 2라운드 뒤로 준결승·결승뿐이다
function tnPath(t,r,i){
  const o=[];
  if(isF3(t)){if(r>3)return o;if(r===0){o.push(`0-${i}`);r=1;i>>=1}if(r===1){o.push(`1-${i}`);r=2}if(r===2)o.push('2-0');o.push('3-0');return o}
  for(const R=tnRounds(t);r<R;r++,i>>=1)o.push(`${r}-${i}`);
  return o;
}
function tnClear(t,r,i){tnPath(t,r,i).forEach(k=>delete t.res[k])} // 이 경기와 그 뒤로 이어지는 경기 결과를 지운다
const tnHasRes=(t,r,i)=>tnPath(t,r,i).some(k=>t.res[k]);

/* ---------- 파이널 라운드(f3): 득실로 결승 직행 팀 정하기 ---------- */
function tnMatchScore(t,r,i,A,B){ // 이 경기 점수(위 칸, 아래 칸). 끝나지 않았거나 점수가 없으면 null
  const x=t.res[`${r}-${i}`];if(!x)return null;
  const g=tnGame(x.gid);if(g)return g.status==='final'?tnScore(A,B,g):null;
  return x.a==null||x.b==null||x.a===''||x.b===''?null:[+x.a,+x.b];
}
function tnDiff(t,T){ // 예선 2라운드에서 T팀의 득실
  let d=0;
  for(let i=0;i<3;i++){
    const A=tnSlot(t,1,i,0),B=tnSlot(t,1,i,1);if(!A||!B||A===TN_BYE||B===TN_BYE)continue;
    const s=A.name===T.name?0:B.name===T.name?1:-1;if(s<0)continue;
    const sc=tnMatchScore(t,1,i,A,B);if(sc)d+=s?sc[1]-sc[0]:sc[0]-sc[1];
  }
  return d;
}
function tnFinal(t){
  const w=[0,1,2].map(i=>tnWin(t,1,i)),ready=w.every(Boolean);
  const rows=w.filter(T=>T&&T!==TN_BYE).map(T=>{const v=t.girls?.[T.name];return {T,d:tnDiff(t,T),girls:v==null||v===''?null:+v}});
  rows.sort((a,b)=>b.d-a.d||(b.girls??-1)-(a.girls??-1));
  if(!ready||!rows.length)return {rows,ready:false};
  let top=t.direct?rows.find(x=>x.T.name===t.direct):null,how='pick';
  if(!top){
    const tied=rows.filter(x=>x.d===rows[0].d);
    if(tied.length===1){top=tied[0];how='gd'}
    else if(tied.some(x=>x.girls==null))return {rows,ready,tied,need:'girls'};
    else{const m=Math.max(...tied.map(x=>x.girls)),gt=tied.filter(x=>x.girls===m);
      if(gt.length>1)return {rows,ready,tied:gt,need:'pick'};
      top=gt[0];how='girls'}
  }
  rows.sort((a,b)=>(b===top)-(a===top));
  const rest=rows.slice(1).map(x=>x.T);
  return {rows,ready,direct:top.T,semi:[rest[0]||TN_BYE,rest[1]||TN_BYE],how};
}
const tnSig=t=>{if(!isF3(t))return '';const f=tnFinal(t);return f.direct?[f.direct,...f.semi].map(x=>x.name||'').join('|'):''};
function tnRerank(t,fn){const s=tnSig(t);fn();if(tnSig(t)!==s)tnClear(t,2,0)} // 직행 팀이 바뀌면 준결승·결승 결과는 맞지 않으므로 지운다

function tnFill(teams,size){
  let l=[1],n=1;while(n<size){n*=2;l=l.flatMap(s=>[s,n+1-s])}
  const q=[...teams];return l.map(seed=>seed<=teams.length?q.shift():null);
}

function tnFillF3(teams){const q=[...teams],b=12-teams.length,o=[];for(let i=0;i<6;i++){o.push(q.shift()||null);o.push(i<b?null:q.shift()||null)}return o}
const tnArrange=(t,teams)=>isF3(t)?tnFillF3(teams):tnFill(teams,t.size);
function tnShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const tnSizeFor=n=>{let s=2;while(s<n)s*=2;return s};

function tnCard(t,r,i,edit){

  if(f3&&(n<6||n>12)){$('#tnErr').textContent='예선 + 파이널 방식은 6팀부터 12팀까지 만들 수 있어요.';return}
  if(n<2){$('#tnErr').textContent='참가 학급을 두 팀 이상 골라 주세요.';return}
  if(n>16){$('#tnErr').textContent='한 토너먼트는 16팀까지 만들 수 있어요.';return}
  const teams=classes().filter(c=>m.sel.includes(c.id)).map(c=>tnTeamOf(c,m.gtype));
  const t={id:uid('t'),name,gtype:m.gtype,createdAt:Date.now(),rev:1,size:f3?12:tnSizeFor(n),slots:[],ov:{},res:{}};
  if(f3){t.fmt='f3';t.girls={};t.direct=''}
  t.slots=tnArrange(t,m.order==='rand'?tnShuffle(teams):teams);
  tns().push(t);state.tnId=t.id;state.tnEdit=false;closeModal();persist();render();toast('토너먼트를 만들었어요. [✏️ 배정 수정]으로 칸을 바꿀 수 있어요.');
}

/* ---------- 배정 수정: 칸 하나 바꾸기 ---------- */
function tnPool(t){ // 고를 수 있는 팀: 대진표에 있는 팀 + 학급 전체
  const out=[],add=x=>{if(x&&x.name&&!out.some(y=>y.name===x.name))out.push(x)};
  t.slots.forEach(add);Object.values(t.ov).forEach(add);classes().forEach(c=>add(tnTeamOf(c,t.gtype)));return out;
}
function openTnSlot(r,i,s){
  const t=tnCur();if(!t)return;
  state.modal={type:'tnslot',tid:t.id,r,i,s,pool:tnPool(t)};
  openModal(`${esc(tnKeyName(t,`${r}-${i}`))} ${s?'아래':'위'} 칸 바꾸기`,tnSlotBody());state.modal.type='tnslot';
}
function tnSlotBody(){
  const m=state.modal,t=tnFind(m.tid),cur=tnSlot(t,m.r,m.i,m.s),hasOv=m.r>0&&`${m.r}-${m.i}-${m.s}` in t.ov;
  const why=isF3(t)&&m.r>1?' 이 칸은 원래 파이널 라운드 결과로 저절로 정해지는 자리예요.':m.r?' 이 칸은 원래 앞 경기 승자가 올라오는 자리예요.':' 이미 다른 칸에 있는 팀을 고르면 두 팀 자리가 서로 바뀌어요.';
  return `<p class="hint" style="margin:0 0 10px">넣을 팀을 누르세요.${why}${tnHasRes(t,m.r,m.i)?' <b>이 칸부터 결승까지 넣어 둔 경기 결과는 지워져요.</b>':''}</p>
    <div class="tn-picks">${m.pool.map((x,k)=>`<button type="button" class="tn-pick" data-act="tn-put" data-k="${k}" aria-pressed="${!!cur&&cur!==TN_BYE&&cur.name===x.name}">${tnLogo(x)}<span>${esc(shortTeam(x.name))}</span></button>`).join('')}</div>
    <div class="tn-own"><input id="tnOwn" type="text" maxlength="14" placeholder="직접 팀 이름 쓰기" aria-label="직접 팀 이름 쓰기"><button type="button" class="btn" data-act="tn-put-own">넣기</button></div>
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button>${hasOv?'<button class="btn" data-act="tn-put-auto">원래대로(저절로 정해지게)</button>':''}<button class="btn" data-act="tn-put-bye">${m.r?'빈칸으로':'빈칸으로(상대 팀 부전승)'}</button></div></div>`;
}
function tnPut(team){
  const m=state.modal,t=tnFind(m.tid);if(!t)return;
  tnRerank(t,()=>{
    if(m.r===0){const idx=2*m.i+m.s,old=t.slots[idx]||null;
      if(team&&old&&old.name===team.name)return;
      const j=team?t.slots.findIndex(x=>x&&x.name===team.name):-1;
      if(j>=0){t.slots[j]=old;tnClear(t,0,j>>1)}
      t.slots[idx]=team;
    }else t.ov[`${m.r}-${m.i}-${m.s}`]=team;
    tnClear(t,m.r,m.i)});
  closeModal();tnSave(t);
}

/* ---------- 경기 칸: 시작·결과 넣기 ---------- */
function openTnMatch(r,i){
  const t=tnCur();if(!t)return;const x=t.res[`${r}-${i}`]||{};
  state.modal={type:'tnmatch',tid:t.id,r,i,w:x.w===0||x.w===1?x.w:null};
  openModal(`${esc(t.name)} ${esc(tnKeyName(t,`${r}-${i}`))}`,tnMatchBody());state.modal.type='tnmatch';
}
function tnMatchBody(){
  const m=state.modal,t=tnFind(m.tid),key=`${m.r}-${m.i}`,x=t.res[key]||{},A=tnSlot(t,m.r,m.i,0),B=tnSlot(t,m.r,m.i,1),g=tnGame(x.gid);
  const nA=esc(shortTeam(A.name)),nB=esc(shortTeam(B.name)),sc=g?tnScore(A,B,g):null,fin=g&&g.status==='final';
  const same=q=>[A,B].some(T=>T.classId&&T.classId===q.classId);
  const cand=finals().filter(q=>!tnOf(q)&&q.teams.every(same));
  const top=g?`<div class="sub-sum" style="margin-top:0"><b>연결된 경기 ${sc[0]} : ${sc[1]}</b> ${fin?'(끝남)':'(진행 중)'}<small>${fin&&sc[0]===sc[1]?'동점이에요. 아래에서 이긴 팀을 골라 주세요.':'경기 점수대로 승자가 정해져요.'}</small></div>
      <div class="btns" style="margin:10px 0"><button class="btn" data-live="${esc(g.id)}">경기 화면 보기</button><button class="btn" data-act="tn-unlink">연결 끊기</button></div>`
    :`<button type="button" class="playball tn-play" data-act="tn-play">${BALL_ICON}<span>이 경기 시작하기</span></button><p class="hint" style="margin:8px 0 12px">PLAY BALL 화면에 두 팀이 들어가요. 타순을 정하고 시작하세요. 경기가 끝나면 결과가 저절로 들어와요.</p>
      ${cand.length?`<div class="tn-own"><select id="tnLink" aria-label="끝난 경기 고르기">${cand.map(q=>{const s=sim(q);return `<option value="${esc(q.id)}">${fmtD(q.endedAt||q.createdAt)} ${esc(q.teams[0].name)} ${s.score[0]} : ${s.score[1]} ${esc(q.teams[1].name)}</option>`}).join('')}</select><button type="button" class="btn" data-act="tn-link">이미 끝난 경기 연결</button></div>`:''}
      <h5 class="mh">경기 없이 점수만 넣기</h5><div class="tn-score"><label>${nA}<input id="tnA" type="number" min="0" max="99" value="${esc(x.a??'')}"></label><b>:</b><label>${nB}<input id="tnB" type="number" min="0" max="99" value="${esc(x.b??'')}"></label></div>`;
  return `${top}<h5 class="mh">이긴 팀</h5><div class="segs"><button type="button" class="seg" data-act="tn-w" data-v="" aria-pressed="${m.w==null}">점수대로</button><button type="button" class="seg" data-act="tn-w" data-v="0" aria-pressed="${m.w===0}">${nA} 승</button><button type="button" class="seg" data-act="tn-w" data-v="1" aria-pressed="${m.w===1}">${nB} 승</button></div>
    <p class="hint" style="margin-top:8px">동점이거나 몰수승처럼 점수로 정할 수 없을 때 이긴 팀을 직접 누르세요.</p>
    <div class="foot"><div class="r"><button class="btn" data-act="close">취소</button><button class="btn go" data-act="tn-res-ok">저장</button></div></div>`;
}
// 승자가 바뀌면 그 뒤 경기에 넣어 둔 결과는 맞지 않으므로 지운다
function tnApply(t,r,i,fn){
  tnRerank(t,()=>{const b=tnWin(t,r,i);fn();const a=tnWin(t,r,i);
    if((b&&b.name)!==(a&&a.name))tnClear(t,r+1,i>>1)});
}
function tnResOk(){
  const m=state.modal,t=tnFind(m.tid),key=`${m.r}-${m.i}`,pa=$('#tnA'),pb=$('#tnB');if(!t)return;
  tnApply(t,m.r,m.i,()=>{const x={...(t.res[key]||{})};
    if(pa){x.a=pa.value.trim();x.b=pb.value.trim()}
    if(m.w==null)delete x.w;else x.w=m.w;
    if(!x.gid&&x.w==null&&!x.a&&!x.b)delete t.res[key];else t.res[key]=x});
  closeModal();tnSave(t);
}
function tnStartMatch(){
  const m=state.modal,t=tnFind(m.tid),A=tnSlot(t,m.r,m.i,0),B=tnSlot(t,m.r,m.i,1),S=newSetup();
  [A,B].forEach((T,k)=>{S.teams[k].classId=T.classId||S.teams[k].classId;S.teams[k].name=T.name});
  S.gtype=t.gtype||S.gtype;S.tn={tid:t.id,key:`${m.r}-${m.i}`};state.setup=S;closeModal();go('play');
}
function tnAttach(gid){
  const m=state.modal,t=tnFind(m.tid),g=tnGame(gid),key=`${m.r}-${m.i}`;if(!t||!g)return;
  tnApply(t,m.r,m.i,()=>{t.res[key]={gid}});g.tn={tid:t.id,key};closeModal();t.rev=(t.rev||0)+1;commitGame(g);toast('끝난 경기를 대진표에 연결했어요.');
}
function tnUnlink(){
  const m=state.modal,t=tnFind(m.tid),key=`${m.r}-${m.i}`,g=tnGame(t?.res[key]?.gid);if(!t)return;
  tnApply(t,m.r,m.i,()=>{delete t.res[key]});if(g){delete g.tn;g.rev=(g.rev||0)+1}
  closeModal();tnSave(t);toast('경기 연결을 끊었어요. 그 경기는 다시 리그 순위에 들어가요.');
}

    case 'walk-toggle':{const on=!walkOn();walkSet(on);render();toast(on?'타자 소개가 끝나면 등장곡 고르기 창이 떠요.':'등장곡 창을 껐어요.');break}
    case 'say-test':{const f=$('#editForm'),t=(f?.elements.say.value.trim())||(f?.elements.pname.value.trim())||'';if(t)speakParts([[t,1,1.05,0]]);break}
    case 'ump-toggle':{const on=!umpOn();umpSet(on);render();toast(on?'볼·스트라이크·파울을 누를 때마다 판정과 볼카운트를 읽어 줘요.':'볼카운트 소리를 껐어요.');break}
    case 'ann-toggle':{const on=!annOn();annSet(on);render();toast(on?'타자가 바뀔 때마다 이름을 불러 줘요.':'타자 자동 소개를 껐어요. [🎤 타자 부르기]로는 부를 수 있어요.');break}
    case 'music-open':openMusic();break;
    case 'song-play':{const s=state.modal?.list?.[+a.dataset.i],free=!!state.modal?.music;closeModal();if(s)playSong(free?{...s,free}:s);break}
    case 'song-rand':{const L=state.modal?.list||[],free=!!state.modal?.music,c=L.length>1?L.filter(x=>x.path!==lastSong):L;closeModal();if(c.length){const s=c[Math.floor(Math.random()*c.length)];playSong(free?{...s,free}:s)}break}
    case 'pick-f':state.modal.f=a.dataset.pid;$('#modal .pb').innerHTML=playBody();break;
    case 'pick-p':state.modal.sel=a.dataset.pid;$('#modal .pb').innerHTML=pitcherBody();break;
    case 'pitcher-ok':{const m=state.modal;closeModal();if(m.sel&&m.sel!==m.cur)addEvent({type:'pitcher',team:m.team,pid:m.sel});break}
    case 'open-pos':openPos();break;
    case 'pos-team':{state.modal.team=+a.dataset.t;state.modal.map={...sim(curGame()).pos[+a.dataset.t]};$('#modal .pb').innerHTML=posBody();break}
    case 'pos-ok':confirmPos();break;
    case 'open-lineup':openLineup();break;
    case 'open-sub':openLineup('sub');break;
    case 'export-data':exportData();break;
    case 'merge-data':pickMergeFile();break;
    // 라인업 수정 창: 탭·팀을 바꾸면 고른 것을 비운다
    case 'lu-mode':case 'lu-team':{const m=state.modal;if(act==='lu-mode')m.mode=a.dataset.m;else m.team=+a.dataset.t;
      Object.assign(m,{out:null,in:null,a:null,b:null,at:-1,pos:'',rm:null});$('#modal .pb').innerHTML=lineupBody();break}
    case 'rm-pick':{const m=state.modal;m.rm=m.rm===a.dataset.pid?null:a.dataset.pid;$('#modal .pb').innerHTML=lineupBody();break}
    case 'rm-ok':confirmRemove();break;
    case 'sub-out':state.modal.out=a.dataset.pid;$('#modal .pb').innerHTML=lineupBody();break;
    case 'sub-in':case 'add-in':state.modal.in=a.dataset.pid;$('#modal .pb').innerHTML=lineupBody();break;
    case 'sub-ok':confirmSub();break;
    case 'add-ok':confirmAdd();break;
    case 'skip-bat':{const g=curGame(),s=g&&sim(g);if(!s||s.over||!s.batter)break;const nm=gObj(g,s,s.batter.pid).name||s.batter.name||'';
      confirmBox(`${nm} 차례를 넘어갈까요? 아웃은 올라가지 않고 바로 다음 타자로 넘어가요.`,'넘어가기',()=>{addEvent({type:'skip'});toast(`${nm} 차례를 넘어갔어요.`)});break}
    case 'open-order':openLineup('order');break;
    case 'open-tname':openTeamName();break;
    case 'open-gset':openGameSet();break;
    case 'gs-gtype':state.modal.gtype=a.dataset.v;$('#modal .pb').innerHTML=gameSetBody();break;
    case 'gs-self':state.modal.self=a.dataset.v==='1';$('#modal .pb').innerHTML=gameSetBody();break;
    case 'gs-ok':confirmGameSet();break;
    case 'tname-cls':{const f=$('#tnForm');if(f)f.elements['t'+a.dataset.t].value=a.dataset.n;break}
    case 'tname-ok':confirmTeamName();break;
    case 'ord-pick':{const m=state.modal,p=a.dataset.pid;
      if(m.a===p){m.a=m.b;m.b=null}else if(m.b===p)m.b=null;else if(!m.a)m.a=p;else m.b=p;
      $('#modal .pb').innerHTML=lineupBody();break}
    case 'ord-ok':confirmOrder();break;
    case 'vest':S.teams[ti].vest=a.dataset.v;render();break;
    case 'cap':{const l=S.teams[ti].lineup,was=!!l[ii].captain;l.forEach(e=>e.captain=false);l[ii].captain=!was;render();break}
    case 'open-scorers':openScorers();break;
    case 'sc-pick':{const m=state.modal,p=a.dataset.pid;if(m.sel.includes(p))m.sel=m.sel.filter(x=>x!==p);else if(m.sel.length>=SC_MAX){toast(`기록원은 ${SC_MAX}명까지 고를 수 있어요. 먼저 한 명을 빼 주세요.`);break}else m.sel=[...m.sel,p];$('#modal .pb').innerHTML=scorerBody();break}
    case 'sc-ok':{const sel=state.modal.sel;closeModal();if(state.setup){state.setup.scorers=[...sel];render()}break}
    case 'gtype':S.gtype=a.dataset.v;refreshTeamNames(S.teams,S.gtype);render();break;
    case 'selfp':S.selfPitch=a.dataset.v==='1';render();break;
    case 'team-color':S.teams[ti].color=a.dataset.c;render();break;
    case 'undo':{const g=curGame();if(g&&g.events.length){g.events.pop();annLast='';commitGame(g);toast('마지막 기록을 되돌렸어요.')}break}
    case 'runner':openRunner(+a.dataset.base);break;
    case 'runner-do':closeModal();addEvent({type:'runner',base:+a.dataset.base,act:a.dataset.a});break;
    case 'change-pitcher':openPitcher();break;
    case 'half':confirmBox('아웃 카운트와 상관없이 공수를 바꿀까요?','공수교대',()=>addEvent({type:'half'}));break;
    case 'end-game':confirmBox('지금 점수로 경기를 끝낼까요? 되돌리기로 다시 이어갈 수 있어요.','경기 종료',()=>{addEvent({type:'end'});toast('경기가 끝났어요. 뉴스에 리포트가 올라갔어요.')});break;
    case 'del-game':{const g=curGame();confirmBox('이 경기를 삭제할까요? 기록실과 뉴스에서도 사라져요.','경기 삭제',()=>{state.data.games=state.data.games.filter(x=>x.id!==g.id);removeDoc('games',g.id);go('play');toast('경기를 삭제했어요.')});break}
    case 'write-news':openNews();break;
    case 'del-news':{const id=a.dataset.id;confirmBox('이 소식을 삭제할까요?','삭제',()=>{state.data.news=state.data.news.filter(n=>n.id!==id);removeDoc('news',id);render()});break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.set;if(!k)return;
  if(k==='rcls'){state.rec.cls=t.value;render();return}
  if(k==='fielder'){if(state.modal)state.modal.f=t.value;return}
  if(k==='npos'){if(state.modal)state.modal.map[t.dataset.pid]=t.value;return}
  if(k==='gsinn'){if(state.modal?.type==='gset'){state.modal.inn=+t.value;$('#modal .pb').innerHTML=gameSetBody()}return} // 경기 설정 > 이닝 수(끝난 경기면 "이어서 해요" 안내가 바뀜)
  if(k==='luat'||k==='lupos'){const m=state.modal;if(m?.type==='lineup'){if(k==='luat')m.at=+t.value;else m.pos=t.value;$('#modal .pb').innerHTML=lineupBody()}return} // 라인업 수정 > 선수 추가
  const S=state.setup;if(!S)return;
  if(k==='innings')S.innings=+t.value;
  else if(k==='scorer'){S.scorers[+t.dataset.i]=t.value}
  else if(k==='class'){const tm=S.teams[+t.dataset.t];tm.classId=t.value;tm.lineup=[];
    refreshTeamNames(S.teams,S.gtype,+t.dataset.t);S.scorers=(S.scorers||[]).map(x=>x&&S.teams.some(tt=>findCls(tt.classId)?.players?.some(p=>p.id===x))?x:'');render()}
  else if(k==='pos'){S.teams[+t.dataset.t].lineup[+t.dataset.i].pos=t.value}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.set==='name'&&state.setup)state.setup.teams[+t.dataset.t].name=t.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#overlay').hidden){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-stat],[data-act="runner"],tr.click,li.click')){e.preventDefault();e.target.click()}
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&state.modal?.type!=='edit')closeModal()});

addJerseyDefs();render();initStore();
setTimeout(bakeDesignPatterns,300); // 첫 화면이 뜬 뒤 반티 무늬를 사진으로 굽는다
</script>
</body>
</html>
